# GenMol-capacity ordinary CSDNet with normalized CBI+AroCBI.
# Effective global batch: 32 samples/GPU * 4 GPUs * 16 accumulation = 2048.
max_len: 256
dynamic_padding: true
pad_to_multiple_of: 8
max_position_embeddings: 257
batch_size: 32
num_workers: 4
shuffle_buffer: 50000
repeat_stream: true

hidden_size: 768
num_layers: 12
num_heads: 12
intermediate: 3072
hidden_dropout_prob: 0.1
attention_probs_dropout_prob: 0.1
layer_norm_eps: 1.0e-12
initializer_range: 0.02
position_embedding_type: absolute
gradient_checkpointing: true

use_cbi: true
cbi_weight: 2.0
use_aromatic_cbi: true
aromatic_cbi_weight: 1.2
normalized_aromatic_cbi: false
normalized_cbi: true

max_steps: 50000
max_time: "02:23:00:00"
lr: 3.0e-4
warmup_steps: 2500
lr_schedule: constant_with_warmup
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 1.0e-8
ema_decay: 0.9999

devices: 4
strategy: ddp
precision: 16-mixed
accumulate_grad_batches: 16
gradient_clip_val: 1.0
checkpoint_every_n_steps: 1000
checkpoint_dir: csdnet_checkpoints_90m_genmol_normcbi
run_name: csdnet-90m-genmol-normcbi
seed: 42
